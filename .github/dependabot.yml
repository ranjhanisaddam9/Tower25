# Weekly dependency updates (M10 supply chain). NuGet packages are pinned centrally in Directory.Packages.props;
# Dependabot updates that file and the per-project packages.lock.json files together.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.collector"
          - "PdfPig"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
